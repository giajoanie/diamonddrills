services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deca_hub
      POSTGRES_PASSWORD: deca_hub_dev
      POSTGRES_DB: deca_hub
    ports:
      - "5432:5432"
    volumes:
      - deca_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deca_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deca_hub_postgres_data:
